[package]
name = "pleiades-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.94"
boa_engine = "0.20"
boa_gc = "0.20"
boa_runtime = "0.20"
bytes = "1.8"
pleiades-api = { git = "https://github.com/jmessk/pleiades-rs.git", rev = "9b79eaee8c36bf45f33640c807ea612d4ce122aa" }
pleiades = { git = "https://github.com/jmessk/pleiades-rs.git", rev = "9b79eaee8c36bf45f33640c807ea612d4ce122aa" }
tokio = { version = "1.0", features = ["full"] }
pollster = "0.4.0"
cpu-time = "1.0.0"
reqwest = { version = "0.12.9", features = ["blocking"] }
tracing = "0.1.41"
dotenvy = "0.15.7"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
serde = "1.0.216"
serde_json = "1.0.134"
chrono = "0.4.39"
serde_yaml = "0.9.34"
clap = { version = "4.5.23", features = ["derive"] }
duration-str = "0.11.3"
core_affinity = "0.8.1"
zip = "2.2.2"
image = "0.25.5"
flate2 = "1.0.35"
tokio-console = "0.1.13"
console-subscriber = "0.4.1"
sysinfo = "0.33.1"
affinity = "0.1.2"
thread-priority = "1.2.0"
libc = "0.2.177"

[dev-dependencies]
criterion = "0.5.1"

# [build]
# rustflags = ["--cfg", "tokio_unstable"]
